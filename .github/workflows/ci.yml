name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Format ────────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # ── 2. Check ─────────────────────────────────────────────────────────────────
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo check
        run: cargo check --workspace

  # ── 3. Clippy ────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── 4. Rust Tests ────────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo test --lib
        run: cargo test --workspace --lib
        timeout-minutes: 10
      - name: integration tests (providers + domain + evals)
        run: cargo test --tests -p cairn-domain -p cairn-providers -p cairn-evals
        timeout-minutes: 8
        env:
          CARGO_BUILD_JOBS: "2"
      - name: integration tests (runtime + orchestrator)
        # cairn-runtime and cairn-orchestrator contribute 41 + 1
        # non-gated integration test binaries that exercise service,
        # projection, and orchestrator surfaces — they must run here
        # because `--workspace --lib` only covers `src/` unit tests.
        #
        # cairn-app integration tests moved to the `fabric-integration`
        # job: they now spawn the real cairn-app binary against a live
        # Valkey testcontainer and require the docker daemon.
        run: cargo test --tests -p cairn-runtime -p cairn-orchestrator
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C debuginfo=0"
      - name: integration tests (api + memory + tools + graph + agent + workspace + integrations)
        # These crates ship integration tests under `tests/` that
        # `--workspace --lib` does not execute. All crates listed here
        # run in-process with no external services (no Postgres/Valkey/
        # network), so they belong in the plain `test` job rather than
        # `fabric-integration`. cairn-store runs in its own step below
        # with `--features sqlite,postgres` so feature-gated tests
        # actually execute.
        run: cargo test --tests -p cairn-api -p cairn-memory -p cairn-tools -p cairn-graph -p cairn-agent -p cairn-workspace -p cairn-integrations
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C debuginfo=0"
      - name: integration tests (cairn-store with sqlite + postgres features)
        # cairn-store's backend-specific tests (FK ordering, prompt-schema
        # hardening, migration contract) are behind `#[cfg(feature = ...)]`
        # gates. Without the features enabled, copilot #282 flagged that
        # none of those assertions execute in CI. SQLite tests run live
        # against `SqliteAdapter::in_memory()`; Postgres tests are
        # static-SQL assertions against embedded migrations and need no
        # live database.
        run: cargo test --tests -p cairn-store --features sqlite,postgres
        timeout-minutes: 15
        env:
          CARGO_BUILD_JOBS: "2"
          RUSTFLAGS: "-C debuginfo=0"

  # ── 5. Fabric integration (testcontainers) ──────────────────────────────────
  # Stands up a disposable Valkey 8 container via testcontainers-rs and runs
  # the cairn-fabric integration suite end-to-end against it. Runs in
  # parallel (default threadpool) — the harness uses per-test uuid-scoped
  # (tenant, workspace, project) triples to keep keyspaces disjoint.
  fabric-integration:
    name: fabric-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-fabric-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fabric-
            ${{ runner.os }}-cargo-
      - name: cargo test --test integration (default — parallel)
        run: cargo test -p cairn-fabric --test integration
        timeout-minutes: 10
      # HTTP-lifecycle integration tests: launch the real cairn-app
      # binary per harness on an ephemeral port, drive via reqwest,
      # share the Valkey testcontainer. Same runtime constraints as
      # the fabric suite above (needs testcontainers-capable Docker).
      #
      # --features debug-endpoints activates the RFC-011 debug route
      # so test_rfc011_colocation can assert partition placement.
      # Production/release builds MUST NOT enable this feature; see
      # SECURITY.md for the threat model.
      - name: cargo test -p cairn-app --tests --features debug-endpoints
        run: cargo test -p cairn-app --tests --features debug-endpoints --
        timeout-minutes: 10

  # ── 6. UI Build + Type Check + Component Tests ──────────────────────────────
  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm install
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: build
        run: npm run build
      - name: vitest
        run: npx vitest run

  # ── 7. Smoke (release gatekeeper) ───────────────────────────────────────────
  # The HTTP smoke suite at `scripts/smoke-test.sh` is CLAUDE.md's named
  # "release gatekeeper" — 95 end-to-end checks against a running cairn-app.
  # This job enforces the gate on every PR so a smoke regression blocks
  # merge the same way a failing `cargo test` does.
  #
  # Architecture:
  # - Valkey 8 runs as a GitHub Actions service container (NOT testcontainers;
  #   the smoke gate drives the production `cairn-app` binary, not a test
  #   binary, so it needs a sidecar rather than an in-process harness).
  # - `cairn-app` is built in release mode + backgrounded on 127.0.0.1:3000.
  # - `/health/ready` is polled until 200, then `scripts/smoke-test.sh`
  #   runs with `CAIRN_TOKEN` + `CAIRN_URL` pointed at the live binary.
  # - On failure, the backgrounded binary's stdout/stderr is uploaded as a
  #   workflow artifact so operators can diagnose without re-running CI.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping || redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-smoke-
            ${{ runner.os }}-cargo-

      - name: Build cairn-app + smoke_worker (release)
        # Release mode matches what `scripts/smoke-test.sh`'s claim-then-
        # operate fixture expects — it auto-detects `target/release/smoke_worker`
        # and falls back to `cargo run` only if neither release nor debug is
        # built. Building both binaries up front keeps the launch step fast.
        run: cargo build -p cairn-app --release --bin cairn-app --bin smoke_worker
        timeout-minutes: 15

      - name: Launch cairn-app
        # Team mode exercises the full Fabric boot path (HMAC seed, FCALL
        # registration, lease-history subscriber); local mode would short-
        # circuit those and miss regressions the gatekeeper must catch.
        # `--db memory` avoids needing a Postgres sidecar; the in-memory
        # store is the same backing that Fabric's EventBridge writes to
        # when running with the non-durable backend, so projection reads
        # stay coherent for the full smoke surface.
        run: |
          set -euo pipefail
          export CAIRN_ADMIN_TOKEN="dev-admin-token"
          export CAIRN_FABRIC_WAITPOINT_HMAC_SECRET="$(openssl rand -hex 32)"
          export CAIRN_FABRIC_WAITPOINT_HMAC_KID="ci-smoke"
          export CAIRN_FABRIC_URL="valkey://127.0.0.1:6379"
          export RUST_LOG="warn"
          nohup ./target/release/cairn-app \
            --addr 127.0.0.1 --port 3000 \
            --mode team --db memory \
            --allow-missing-sandbox-primitives \
            > /tmp/cairn-rs-smoke.log 2>&1 &
          echo $! > /tmp/cairn-rs-smoke.pid
          echo "cairn-app launched (pid=$(cat /tmp/cairn-rs-smoke.pid))"

      - name: Wait for /health/ready
        # 60s total — release build boots in <5s on GH runners; the buffer
        # covers Fabric seed (FF_ROTATE_WAITPOINT_HMAC_SECRET RTT) plus
        # projection warmup. Fail fast if the process died before ready
        # rather than wait out the full timeout.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            pid="$(cat /tmp/cairn-rs-smoke.pid 2>/dev/null || echo '')"
            if [ -n "$pid" ] && ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::cairn-app exited before /health/ready returned 200"
              tail -n 120 /tmp/cairn-rs-smoke.log || true
              exit 1
            fi
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/health/ready || echo 000)"
            if [ "$code" = "200" ]; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::cairn-app did not reach /health/ready within 60s"
          tail -n 120 /tmp/cairn-rs-smoke.log || true
          exit 1

      - name: Run smoke-test.sh
        env:
          CAIRN_TOKEN: dev-admin-token
          CAIRN_URL: http://127.0.0.1:3000
        run: ./scripts/smoke-test.sh

      - name: Upload cairn-app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cairn-app-smoke-log
          path: /tmp/cairn-rs-smoke.log
          if-no-files-found: warn
