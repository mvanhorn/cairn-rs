[package]
name = "cairn-memory"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cairn-domain = { path = "../cairn-domain" }
# cairn-api-contracts replaces the former cairn-api production dep
# (#440): keeps the layer ordering unidirectional — cairn-memory sits
# below cairn-api in the `domain -> store -> runtime -> memory -> api`
# stack per CLAUDE.md, so a cairn-api production dep here inverted the
# ordering and left a latent cycle risk. The contracts crate holds only
# pure trait + DTO types that both cairn-api (consumer) and
# cairn-memory (implementor) need.
cairn-api-contracts = { path = "../cairn-api-contracts" }
cairn-graph = { path = "../cairn-graph" }
cairn-store = { path = "../cairn-store" }
# RFC 029: bridges between plugin wire types and in-process retrieval/ingest
# types live in `src/plugin_bridge.rs`. plugin-proto only depends on
# cairn-domain, so adding it here does not invert store → memory layering.
cairn-plugin-proto = { path = "../cairn-plugin-proto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
utoipa = "5"
chrono = { version = "0.4", features = ["clock"], default-features = false }
sqlx = { version = "0.8", features = ["runtime-tokio", "json"], optional = true }

[dev-dependencies]
cairn-signal = { path = "../cairn-signal" }
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
postgres = ["sqlx", "sqlx/postgres", "cairn-store/postgres"]
sqlite = ["sqlx", "sqlx/sqlite", "cairn-store/sqlite"]
