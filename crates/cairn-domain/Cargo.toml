[package]
name = "cairn-domain"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
# strum provides `EnumCount` — `BreakerKind::COUNT` is now derived from
# the enum itself, so adding a variant mechanically updates the count
# and the array it sizes (see `cairn-orchestrator::breakers::warn_fired`).
# This was the Copilot pushback on #467: a manually-kept `COUNT` is
# exactly what we're trying to avoid.
strum = { version = "0.28", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
# RFC 031 §Prompt Engineering Contract: `validate_prompt_structure` uses
# line-anchored regex to detect required H2 sections, H3 phases, bullets,
# and the three prohibited anti-patterns.
regex = "1"
once_cell = "1"
# RFC 032 PR-4: `goal_hash()` hashes a goal string into a 16-hex-char
# stable identifier so re-inference can detect mid-run goal changes.
# Version pinned to match the rest of the workspace (cairn-github,
# cairn-runtime, cairn-app).
sha2 = "0.10"
# `Zeroizing<Vec<u8>>` for credential ciphertext in read models (#579).
# Matches the version pinned by `cairn-runtime` and re-exports
# `Zeroize{OnDrop}` for consistent handling across crates. The `serde`
# feature is required because `CredentialRecord` is Serialize +
# Deserialize.
zeroize = { version = "1.7", features = ["derive", "serde"] }
