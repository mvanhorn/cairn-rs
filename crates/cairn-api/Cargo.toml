[package]
name = "cairn-api"
version = "0.1.0"
edition = "2021"
license = "BSL-1.1"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
cairn-agent = { path = "../cairn-agent" }
cairn-api-contracts = { path = "../cairn-api-contracts" }
cairn-domain = { path = "../cairn-domain" }
cairn-tools = { path = "../cairn-tools" }
cairn-evals = { path = "../cairn-evals" }
cairn-graph = { path = "../cairn-graph" }
cairn-runtime = { path = "../cairn-runtime" }
cairn-signal = { path = "../cairn-signal" }
cairn-channels = { path = "../cairn-channels" }
cairn-store = { path = "../cairn-store" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
utoipa = "5"

# cairn-memory dev-dep intentionally dropped in #440: the integration
# tests that used it (`tests/memory_wiring.rs`, `tests/feed_wiring.rs`)
# moved to cairn-memory's own test tree to keep the layer ordering
# unidirectional (cairn-memory depends on cairn-api-contracts, not the
# other way around). See `crates/cairn-memory/tests/api_seam_audit.rs`
# + `crates/cairn-memory/tests/signal_feed_integration.rs` for the
# migrated coverage.
[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

