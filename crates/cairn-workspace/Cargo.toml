[package]
name = "cairn-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "f65_kernel_probe"
path = "src/bin/f65_kernel_probe.rs"
required-features = ["kernel-probe"]

[dependencies]
cairn-domain = { path = "../cairn-domain" }
async-trait = "0.1"
reflink-copy = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "macros", "rt"] }

# F65 PR-4 sandbox runtime: the three-layer kernel fence + overlay driver +
# reflink fallback all require these Linux-only crates. They compile on every
# Linux host (aarch64 + x86_64); non-Linux falls through to stubs.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "sched", "process", "fs", "user", "socket", "signal", "ptrace"] }
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"
command-fds = "0.3"

# Optional dependencies gated behind the `kernel-probe` feature so the
# spike binary pulls its chrono/anyhow deps only when the probe feature is
# on. The runtime crates above (nix/landlock/seccompiler) are shared — the
# probe binary uses the main crate's versions.
[dependencies.anyhow]
version = "1"
optional = true

[dependencies.chrono]
version = "0.4"
default-features = false
features = ["clock"]
optional = true

[features]
default = []
# Compiles the `f65_kernel_probe` binary. Gated so the probe-specific deps
# stay out of the default cargo build + lib consumers. The main runtime
# deps (nix/landlock/seccompiler) are shared with PR-4's confinement module
# and already live in the target-cfg block above; the feature just pulls in
# the probe's stdout-formatting crates.
kernel-probe = ["dep:anyhow", "dep:chrono"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
tempfile = "3"

[lints]
workspace = true
