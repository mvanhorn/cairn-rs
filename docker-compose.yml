# cairn-rs — production-ready deployment with Postgres + Valkey
#
# Quick start:
#   docker compose up --build
#
# Background:
#   docker compose up -d --build
#
# Stop:
#   docker compose down
#
# Wipe everything (including database):
#   docker compose down -v
#
# Override settings via .env file:
#   cp .env.example .env && $EDITOR .env
#
# Connect an LLM provider — set one of these in .env:
#   CAIRN_BRAIN_URL + OPENAI_COMPAT_API_KEY   (OpenAI, Anthropic proxy, Groq, etc.)
#   OPENROUTER_API_KEY                         (OpenRouter)
#   OLLAMA_HOST                                (Ollama)
#   BEDROCK_API_KEY + BEDROCK_MODEL_ID         (AWS Bedrock)
#
# Or configure providers at runtime via the dashboard or POST /v1/providers/connections.
#
# In-memory mode (dev only, no Postgres needed):
#   docker compose up cairn --build   # skip postgres service
#   # and set: command: ["--db", "memory"]

services:

  # ── Postgres ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cairn
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cairn-dev-password}"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Valkey (FlowFabric state) ────────────────────────────────────────────────
  # cairn-app uses FlowFabric (ferriskey + Valkey Functions API) for lease /
  # lifecycle / eligibility state. Valkey 7.0+ is a hard requirement (Functions
  # API); 8.x is recommended for the Lua-sandbox CVE patches FF's CI validates
  # against. See crates/cairn-fabric/src/version_check.rs for the gate.
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Cairn control plane ──────────────────────────────────────────────────────
  cairn:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Database ───────────────────────────────────────────────────────────
      DATABASE_URL: "postgres://cairn:${POSTGRES_PASSWORD:-cairn-dev-password}@postgres:5432/cairn"

      # ── FlowFabric (Valkey) ────────────────────────────────────────────────
      # `CAIRN_FABRIC_URL` is the single knob for backend connection.
      # Valkey variants: `valkey://host:port`, `rediss://host:port`
      # (TLS), `valkey://host:port?tls=1&cluster=1` (explicit flags).
      CAIRN_FABRIC_URL: "${CAIRN_FABRIC_URL:-valkey://valkey:6379}"
      # Required 32-byte hex secret (64 hex chars). Generate with
      # `openssl rand -hex 32`, store in `.env`, and rotate at runtime via
      # `POST /v1/admin/rotate-waitpoint-hmac`.
      CAIRN_FABRIC_WAITPOINT_HMAC_SECRET: "${CAIRN_FABRIC_WAITPOINT_HMAC_SECRET:?set in .env (openssl rand -hex 32)}"

      # ── Auth ───────────────────────────────────────────────────────────────
      # Required: bearer token for the admin account. The compose stack
      # boots in `team` mode by default, where cairn-app fail-closes if
      # `CAIRN_ADMIN_TOKEN` is missing. Removing the dev-admin-token
      # default here prevents docker-compose users from accidentally
      # shipping an instance with the public test credential — same
      # rationale as the Dockerfile change in this PR.
      #
      # Generate with: `openssl rand -hex 32` and store in `.env`:
      #   echo "CAIRN_ADMIN_TOKEN=$(openssl rand -hex 32)" >> .env
      CAIRN_ADMIN_TOKEN: "${CAIRN_ADMIN_TOKEN:?set in .env (openssl rand -hex 32)}"
      CAIRN_MODE: "${CAIRN_MODE:-team}"

      # ── LLM Providers (all optional — configure via env or dashboard) ──────
      CAIRN_BRAIN_URL: "${CAIRN_BRAIN_URL:-}"
      CAIRN_WORKER_URL: "${CAIRN_WORKER_URL:-}"
      OPENAI_COMPAT_API_KEY: "${OPENAI_COMPAT_API_KEY:-}"
      OPENAI_COMPAT_BASE_URL: "${OPENAI_COMPAT_BASE_URL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OLLAMA_HOST: "${OLLAMA_HOST:-}"
      BEDROCK_API_KEY: "${BEDROCK_API_KEY:-}"
      BEDROCK_MODEL_ID: "${BEDROCK_MODEL_ID:-}"
      AWS_REGION: "${AWS_REGION:-}"

      # ── GitHub App Integration (optional) ──────────────────────────────
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_PRIVATE_KEY_FILE: "${GITHUB_PRIVATE_KEY_FILE:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pg_data:
    driver: local
  valkey_data:
    driver: local
